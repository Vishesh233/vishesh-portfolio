<!-- OG CARD SOURCE
     Renders public/og-image.png (1200x630): open this file in a browser
     (or headless Chrome --window-size=1200,630) and screenshot it. The colours
     are the Twilight Mist tokens from src/styles/tokens.css — the dark-theme
     values, so the card carries the twilight navy canvas with teal and
     lavender accents and a tiny gold detail — kept in sync by hand because
     this file is outside the build. The @font-face rules point at the same
     fontsource files the site bundles, so the card's type matches the hero
     rather than falling back to OS defaults. -->
<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Geist'; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 100 900; font-style: normal; font-display: block; }
@font-face { font-family: 'Geist Mono'; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 100 900; font-style: normal; font-display: block; }
@font-face { font-family: 'Instrument Serif'; src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: block; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background-color: #080B14; background-image: linear-gradient(180deg, #080B14 0%, #111827 100%); color: #F3F4F6; font-family: 'Geist', 'Segoe UI', system-ui, sans-serif; position: relative; }
/* Hero-style glow: electric blue low-left, teal high-right, cores off-canvas. */
.glow-blue { position: absolute; left: -180px; bottom: -220px; width: 620px; height: 620px; border-radius: 50%; background: rgba(79, 124, 255, 0.45); filter: blur(130px); }
.glow-teal { position: absolute; right: -160px; top: -180px; width: 520px; height: 520px; border-radius: 50%; background: rgba(34, 199, 184, 0.4); filter: blur(130px); }
.frame { position: absolute; inset: 36px; border: 1px solid #263550; }
.content { position: absolute; left: 96px; top: 88px; right: 96px; bottom: 80px; display: flex; flex-direction: column; justify-content: space-between; }
.kicker { font-family: 'Geist Mono', Consolas, monospace; font-size: 22px; letter-spacing: 0.34em; text-transform: uppercase; color: #C6A15B; }
h1 { font-size: 104px; font-weight: 400; color: #F3F4F6; letter-spacing: -0.02em; line-height: 1.04; }
h1 em { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; background: linear-gradient(90deg, #22C7B8, #8B6DFF, #4F7CFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
.rule { width: 132px; height: 7px; background: linear-gradient(90deg, #22C7B8, #8B6DFF); margin-top: 34px; }
.role { font-family: 'Geist Mono', Consolas, monospace; font-size: 30px; letter-spacing: 0.30em; text-transform: uppercase; color: #22C7B8; margin-top: 34px; }
.stack { font-family: 'Geist Mono', Consolas, monospace; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; color: #A8B1C2; display: flex; justify-content: space-between; }
.dot { color: #C6A15B; }
</style></head><body>
<div class="glow-blue"></div>
<div class="glow-teal"></div>
<div class="frame"></div>
<div class="content">
<div class="kicker">Portfolio</div>
<div><h1>Vishesh <em>Khanna</em></h1><div class="rule"></div><div class="role">Full-Stack Software Engineer</div></div>
